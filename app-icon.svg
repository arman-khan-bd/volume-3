<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Zone Border Glow Gradient -->
    <linearGradient id="zoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Volume Bar Gradient -->
    <linearGradient id="volGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Screen Zone Container -->
  <rect x="72" y="72" width="880" height="880" rx="200" fill="url(#bgGrad)" stroke="url(#zoneBorder)" stroke-width="28" />

  <!-- Dotted/Dashed Screen Zone Guide Line -->
  <rect x="120" y="120" width="784" height="784" rx="160" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="24 16" opacity="0.45" />

  <!-- Central Volume & Wheel Graphic Group -->
  <g filter="url(#glow)">
    <!-- Speaker Body -->
    <path d="M 340 370 L 440 370 L 560 270 L 560 754 L 440 654 L 340 654 Z" fill="url(#volGrad)" />

    <!-- Speaker Base Rect Core -->
    <rect x="290" y="420" width="90" height="184" rx="20" fill="url(#volGrad)" />

    <!-- Volume Waves (Zone Sound Rays) -->
    <!-- Wave 1 (Small) -->
    <path d="M 630 430 A 110 110 0 0 1 630 594" fill="none" stroke="#38bdf8" stroke-width="28" stroke-linecap="round" />

    <!-- Wave 2 (Medium) -->
    <path d="M 700 360 A 200 200 0 0 1 700 664" fill="none" stroke="#818cf8" stroke-width="32" stroke-linecap="round" />

    <!-- Wave 3 (Large) -->
    <path d="M 770 290 A 290 290 0 0 1 770 734" fill="none" stroke="#c084fc" stroke-width="36" stroke-linecap="round" />
  </g>

  <!-- Scroll Wheel Indicator Notch at top right -->
  <rect x="480" y="150" width="64" height="110" rx="32" fill="#38bdf8" opacity="0.85" />
  <circle cx="512" cy="184" r="14" fill="#ffffff" />
</svg>
